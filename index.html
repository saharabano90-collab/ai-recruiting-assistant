<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireAI Dashboard</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-sidebar: #0f1524;
            --bg-card: #131b2e;
            --bg-hover: #1e2942;
            --active-blue: #1e3a8a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            /* Status Colors */
            --status-active: #10b981;
            --status-open: #3b82f6;
            --status-done: #64748b;
            --status-avg: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        aside {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            flex-shrink: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
            padding-left: 8px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .logo-badge {
            background-color: #1e3a8a;
            color: #60a5fa;
            font-size: 0.65rem;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .nav-section {
            margin-bottom: 28px;
        }

        .nav-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 8px;
            font-weight: 700;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
        }

        .nav-item.active {
            background-color: var(--active-blue);
            font-weight: 500;
        }

        .nav-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-badge {
            background-color: #2563eb;
            color: white;
            font-size: 0.75rem;
            padding: 1px 6px;
            border-radius: 10px;
        }

        /* Main Workspace Content */
        main {
            flex-grow: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1400px;
            width: 100%;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Top Analytical Row */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }

        .metric-status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }

        .metric-status-badge.active { color: var(--status-active); }
        .metric-status-badge.open { color: var(--status-open); }
        .metric-status-badge.done { color: var(--status-done); }
        .metric-status-badge.avg { color: var(--status-avg); }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Layout Grid for Split Panels */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1024px) {
            .workspace-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* Standalone Panels */
        .panel-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .panel-link:hover {
            color: var(--text-main);
        }

        /* Empty/Placeholder States */
        .empty-placeholder {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .placeholder-icon {
            width: 48px;
            height: 48px;
            background-color: rgba(236, 72, 153, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 1.25rem;
        }

        .placeholder-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .placeholder-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 280px;
        }

        /* Action Buttons/List styling */
        .action-button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s, border-color 0.2s;
            width: 100%;
        }

        .action-btn:hover {
            background-color: var(--bg-hover);
            border-color: #334155;
        }

        .action-icon {
            font-size: 1rem;
            opacity: 0.8;
            width: 16px;
            text-align: center;
        }
    </style>
</head>
